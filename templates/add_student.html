<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Student</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c26, #64b168);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .form-card {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 400px;
            color: #e0fce4;
            text-align: center;
            animation: fadeInUp 0.7s ease-in-out;
        }

        h2 {
            margin-bottom: 25px;
            text-shadow: 0 0 5px #c8f0c8;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            text-align: left;
        }

        input[type="text"],
        input[type="password"],
        select {
            width: 100%;
            padding: 10px 15px;
            margin-bottom: 20px;
            border: 1px solid #9ef3b2;
            border-radius: 10px;
            background-color: rgba(30, 60, 38, 0.8); 
            color: #e0fce4;
            font-size: 16px;
            transition: box-shadow 0.3s ease;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        select {
            background-image:
                linear-gradient(45deg, transparent 50%, #90ee90 50%),
                linear-gradient(135deg, #90ee90 50%, transparent 50%),
                linear-gradient(to right, #9ef3b2, #9ef3b2);
            background-position:
                calc(100% - 20px) calc(1em + 2px),
                calc(100% - 15px) calc(1em + 2px),
                100% 0;
            background-size: 5px 5px, 5px 5px, 1px 1.5em;
            background-repeat: no-repeat;
        }

        input:focus,
        select:focus {
            outline: none;
            box-shadow: 0 0 8px #90ee90;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #43a047;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #2e7d32;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .form-card {
                padding: 25px;
            }
        }
    </style>
</head>
<body>

    <div class="form-card">
        <h2>Add Student</h2>
        <form method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="userid">User ID:</label>
            <input type="text" id="userid" name="userid" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="department">Department:</label>
            <select id="department" name="department" required>
                <option value="" disabled selected>Select Department</option>
                <option value="cse">Computer Science Engineering</option>
                <option value="it">Information Technology</option>
                <option value="ece">Electronics and Communication</option>
                <option value="mech">Mechanical Engineering</option>
                <option value="civil">Civil Engineering</option>
               
            </select>

            <button type="submit">Add Student</button>
        </form>
    </div>

</body>
</html>
