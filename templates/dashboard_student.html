<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Student Dashboard</title>
<style>
    /* General page and font styling */
    body {
        margin: 0;
        padding: 0 20px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #65e965, #302d2d);
        color: #d4f0d4;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    a.logout-link {
        align-self: flex-end;
        margin: 20px 0 0 0;
        font-weight: 700;
        color: #9ff784;
        text-decoration: none;
        font-size: 14px;
        transition: color 0.3s ease;
    }
    a.logout-link:hover {
        color: #e6ffe6;
    }

    h2 {
        margin-top: 10px;
        font-weight: 700;
        text-shadow: 0 0 5px #a5d6a7;
    }

    /* Container boxes */
    .container {
        background: rgba(255, 255, 255, 0.15);
        padding: 25px 30px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        width: 100%;
        max-width: 520px;
        margin-bottom: 30px;
        box-sizing: border-box;
    }

    /* Documents List Styling */
    .documents-list h3 {
        margin-top: 0;
        margin-bottom: 15px;
        text-shadow: 0 0 3px #8bc48b;
    }

    .documents-list ul {
        list-style: none;
        padding-left: 0;
        max-height: 200px;
        overflow-y: auto;
        margin: 0;
    }
    .documents-list li {
        background: rgba(255, 255, 255, 0.3);
        padding: 12px 15px;
        border-radius: 10px;
        margin-bottom: 12px;
        box-shadow: inset 0 0 5px #9ff784;
        color: #1b3a1b;
        font-weight: 600;
    }
    .documents-list p {
        font-style: italic;
        color: #c3e6c3;
    }

    /* Request Form Styling */
    .request-form h3 {
        margin-top: 0;
        margin-bottom: 15px;
        text-shadow: 0 0 3px #8bc48b;
    }
    form label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        color: #d4f0d4;
        text-shadow: 0 0 2px #72c572;
    }
    form select, form textarea {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: none;
        background: rgba(230, 240, 230, 0.6);
        color: #1b3a1b;
        font-size: 14px;
        box-shadow: inset 1px 1px 5px rgba(0,0,0,0.15);
        margin-bottom: 18px;
        resize: vertical;
        box-sizing: border-box;
        transition: transform 0.3s ease, background-color 0.3s ease;
    }
    form select:focus, form textarea:focus {
        outline: none;
        transform: scale(1.03);
        background-color: #d2ebd2;
        box-shadow: 0 0 10px #7bc47b;
    }
    button[type="submit"] {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: none;
        background-color: #9ff784;
        color: #0a250a;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.3s ease;
        box-shadow: 0 4px 10px rgba(160,255,140,0.6);
    }
    button[type="submit"]:hover {
        background-color: #76b56f;
        transform: translateY(-3px);
        box-shadow: 0 6px 14px rgba(120,230,110,0.9);
    }

    /* Error message styling */
    .error-message {
        color: #ffb3b3;
        font-size: 14px;
        margin-bottom: 12px;
        text-align: center;
        display: none;
        text-shadow: 0 0 3px #ff4d4d;
    }

    @media (max-width: 600px) {
        .container {
            width: 95%;
            padding: 20px 25px;
        }
    }
</style>
</head>
<body>
    <a href="/logout" class="logout-link">Logout</a>
    <h2>Welcome Student, {{ username }}</h2>

    <section class="container documents-list">
        <h3>Your Documents</h3>
        {% if documents %}
            <ul>
                {% for doc in documents %}
                <li>{{ doc.name }} (Issued on: {{ doc.issued_date }})</li>
                {% endfor %}
            </ul>
        {% else %}
            <p>You have no documents issued yet.</p>
        {% endif %}
    </section>

    <section class="container request-form">
        <h3>Request Document from HOD</h3>
        <form id="requestDocForm" method="post" action="/request-document" novalidate>
            <div class="error-message" id="errorMsg">Please select a document type.</div>

            <label for="doc_type">Select Document Type:</label>
            <select name="doc_type" id="doc_type" required>
                <option value="" disabled selected>Select a document</option>
                <option value="transcript">Transcript</option>
                <option value="provisional_certificate">Provisional Certificate</option>
                <option value="conduct_certificate">Conduct Certificate</option>
                <option value="others">Others</option>
            </select>

            <label for="remarks">Remarks / Reason (optional):</label>
            <textarea name="remarks" id="remarks" rows="3" placeholder="Add any remarks or reason"></textarea>

            <button type="submit">Send Request</button>
        </form>
    </section>

<script>
    const form = document.getElementById('requestDocForm');
    const docTypeSelect = document.getElementById('doc_type');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', function(event) {
        errorMsg.style.display = 'none'; // reset error display

        if (!docTypeSelect.value) {
            event.preventDefault();
            errorMsg.style.display = 'block';
            docTypeSelect.focus();
            return;
        }

        const confirmMsg = `Are you sure you want to request the document: "${docTypeSelect.options[docTypeSelect.selectedIndex].text}"?`;
        if (!confirm(confirmMsg)) {
            event.preventDefault();
        }
    });
</script>
</body>
</html>
