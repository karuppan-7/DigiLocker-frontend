<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #65e965, #302d2d);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        form {
            background: rgba(255, 255, 255, 0.15);
            padding: 30px 35px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 320px;
            animation: fadeIn 1s ease forwards;
            opacity: 0;
            transform: translateY(30px);
            color: #f0f9f4;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: 700;
            color: #d4f0d4;
            text-shadow: 0 0 5px #a5d6a7;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            color: #d4f0d4;
        }

        select,
        input[type="text"],
        input[type="password"],
        input[type="text"].password-visible {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            margin-bottom: 18px;
            background: transparent;
            color: #e8f5e9;
            font-size: 14px;
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.1);
            box-sizing: border-box;
            transition: border-color 0.3s ease, background-color 0.3s ease, color 0.3s ease;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        select option {
            background: #2e2e2e;
            color: #e8f5e9;
        }

        select:focus,
        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="text"].password-visible:focus {
            outline: none;
            border-color: #9ff784;
            background-color: rgba(255, 255, 255, 0.1);
            color: #d4f0d4;
            transform: scale(1.03);
        }

        .password-wrapper {
            position: relative;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 18px;
        }

        .toggle-btn {
            position: absolute;
            right: 12px;
            top: 25%;
            transform: translateY(-25%);
            background: transparent;
            border: none;
            color: #392bf5ec;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            -webkit-user-select: none;
            user-select: none;
            transition: color 0.3s ease;
        }

        .toggle-btn:hover {
            color: #000000;
        }

        button[type="submit"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: #cffad6ec;
            color: rgb(42, 72, 245);
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        button[type="submit"]:hover {
            background-color: #000000;
            transform: translateY(-3px);
        }

        p {
            margin-top: 12px;
            font-size: 14px;
            color: #ffb3b3;
            text-align: center;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        p.visible {
            opacity: 1;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #departmentLabel {
            display: none;
        }
        #department {
            display: none;
        }
    </style>
</head>
<body>
    <form method="post" id="loginForm" novalidate>
        <h2>Login</h2>

        <label for="role">Role:</label>
        <select name="role" id="role" required>
            <option value="admin">Admin</option>
        <label for="department" id="departmentLabel">Department:</label>
            <option value="student">Student</option>
        <select name="department" id="department">
            <option value="" disabled selected>Select Department</option>
            <option value="cse">Computer Science</option>
            <option value="ece">Electronics</option>
            <option value="mech">Mechanical</option>
            <option value="civil">Civil</option>
        </select>
            <option value="mech">Mechanical</option>
            <option value="civil">Civil</option>
        </select>

        <label for="userid">User ID:</label>
        <input type="text" name="userid" id="userid" required>

        <label for="password">Password:</label>
        <div class="password-wrapper">
            <input type="password" name="password" id="passwordField" required placeholder="Enter your password" title="Password">
            <button type="button" class="toggle-btn" aria-label="Show password" onclick="togglePassword(event)">Show</button>
        </div>

        <button type="submit">Login</button>
        <p id="errorMsg" class="{{ 'visible' if msg else '' }}">{{ msg }}</p>
    </form>

    <script>
        // Fade in the form on load
        window.onload = () => {
            document.getElementById('loginForm').style.animationPlayState = 'running';
            toggleDepartmentField();  // Initialize on load
        }

        // Toggle password visibility
        function togglePassword(event) {
            const pwdInput = document.getElementById('passwordField');
            const btn = event.currentTarget;

            if (pwdInput.type === "password") {
                pwdInput.type = "text";
                pwdInput.classList.add('password-visible');
                btn.textContent = "Hide";
                btn.setAttribute('aria-label', 'Hide password');
            } else {
                pwdInput.type = "password";
                pwdInput.classList.remove('password-visible');
                btn.textContent = "Show";
                btn.setAttribute('aria-label', 'Show password');
            }
        }

        // Show/hide department select based on role
        const roleSelect = document.getElementById('role');
        const departmentSelect = document.getElementById('department');
        const departmentLabel = document.getElementById('departmentLabel');

        roleSelect.addEventListener('change', toggleDepartmentField);

        function toggleDepartmentField() {
            const role = roleSelect.value;
            if (role === 'hod' || role === 'student') {
                departmentSelect.style.display = 'block';
                departmentLabel.style.display = 'block';
                departmentSelect.setAttribute('required', 'required');
            } else {
                departmentSelect.style.display = 'none';
                departmentLabel.style.display = 'none';
                departmentSelect.removeAttribute('required');
                departmentSelect.value = "";
            }
        }

        // Animate error message
        const errorMsg = document.getElementById('errorMsg');
        if (errorMsg.textContent.trim() !== "") {
            errorMsg.classList.add('visible');
        }
    </script>
</body>
</html>
